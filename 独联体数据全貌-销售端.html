<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>独联体数据全貌 · 销售端</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --panel:     #101627;
      --card:      #131c30;
      --border:    #1e3a5f;
      --accent1:   #00c8ff;
      --accent2:   #7b5cf0;
      --accent3:   #00e5a0;
      --text-hi:   #e8f4ff;
      --text-mid:  #8ba8cc;
      --text-lo:   #4a6480;
      --glow1:     rgba(0,200,255,.18);
      --glow2:     rgba(123,92,240,.20);
      --glow3:     rgba(0,229,160,.16);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text-hi);
      overflow-x: auto;
    }

    /* ── 顶栏 ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid #1a2d45;
      background: linear-gradient(90deg, rgba(0,200,255,.04) 0%, transparent 60%);
      position: relative;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 40%; height: 1px;
      background: linear-gradient(90deg, var(--accent1), transparent);
    }
    .title-main {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--accent1), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .title-sub {
      font-size: 12px;
      color: var(--text-mid);
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .btn-feedback {
      padding: 8px 18px;
      border: 1px solid var(--accent2);
      border-radius: 6px;
      background: rgba(123,92,240,.12);
      color: #c4b5fd;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all .25s;
    }
    .btn-feedback:hover {
      background: rgba(123,92,240,.28);
      box-shadow: 0 0 14px var(--glow2);
    }

    /* ── 主画布 ── */
    main {
      padding: 36px 40px 50px;
      min-height: calc(100vh - 68px);
    }

    /* ── 大容器框 ── */
    .region-frame {
      position: relative;
      border: 1px dashed #1e3a5f;
      border-radius: 14px;
      padding: 28px 32px 36px;
      background: rgba(16,22,39,.6);
    }
    .region-label {
      position: absolute;
      top: -13px; left: 24px;
      background: var(--bg);
      padding: 2px 12px;
      font-size: 11px;
      color: var(--accent1);
      letter-spacing: 2px;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
    }

    /* ── 布局行 ── */
    .row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    /* ── 源节点 ── */
    .source-card {
      flex-shrink: 0;
      width: 148px;
      height: 148px;
      border: 1px solid var(--accent1);
      border-radius: 12px;
      background: linear-gradient(145deg, #0d1e38, #091526);
      box-shadow: 0 0 24px var(--glow1), inset 0 1px 0 rgba(0,200,255,.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }
    .source-card::before {
      content: '';
      position: absolute;
      inset: -1px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(0,200,255,.4), transparent 50%);
      z-index: -1;
      opacity: .5;
    }
    .globe-icon {
      width: 44px; height: 44px;
      background: radial-gradient(circle at 35% 35%, #1a3a6e, #0a1a35);
      border: 1.5px solid var(--accent1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 12px var(--glow1);
    }
    .source-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-hi);
      letter-spacing: 1px;
    }
    .source-sub {
      font-size: 11px;
      color: var(--text-mid);
      letter-spacing: 1px;
    }
    .source-dot {
      width: 7px; height: 7px;
      background: var(--accent3);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--glow3);
      margin-top: 2px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.6); }
    }

    /* ── SVG 连线区域 ── */
    .connector-svg {
      flex: 1;
      height: 260px;
      overflow: visible;
    }

    /* ── 目标节点列 ── */
    .targets-col {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .target-card {
      width: 164px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(145deg, #0f1e35, #0a1525);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: border-color .25s, box-shadow .25s;
      cursor: default;
    }
    .target-card:hover {
      border-color: var(--accent1);
      box-shadow: 0 0 18px var(--glow1);
    }
    .target-card .country-icon {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #0d1c30;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .target-card .code {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent1);
      letter-spacing: 2px;
    }
    .target-card .name-zh {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-hi);
    }
    .target-card .name-en {
      font-size: 11px;
      color: var(--text-mid);
    }
    /* 左侧发光竖线装饰 */
    .target-card::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 2px;
      border-radius: 2px;
      background: var(--accent1);
      box-shadow: 0 0 8px var(--accent1);
    }

    /* ── 右侧资源列 ── */
    .resources-col {
      flex-shrink: 0;
      margin-left: 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-self: center;
    }
    .res-card {
      width: 180px;
      height: 100px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      background: linear-gradient(145deg, #0f1e35, #0a1525);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-hi);
      letter-spacing: 1px;
      cursor: default;
      transition: border-color .25s, box-shadow .25s;
      position: relative;
      overflow: hidden;
    }
    .res-card::after {
      content: '';
      position: absolute;
      top: -30%; left: -30%;
      width: 80%; height: 80%;
      background: radial-gradient(circle, rgba(0,200,255,.07), transparent 70%);
      pointer-events: none;
    }
    .res-card:hover {
      border-color: var(--accent2);
      box-shadow: 0 0 20px var(--glow2);
    }
    .res-card .res-icon { font-size: 22px; }
    .res-card.ai-card {
      border-color: rgba(0,200,255,.35);
      background: linear-gradient(145deg, #0f2040, #0a1525);
    }
    .res-card.hq-card {
      border-color: rgba(123,92,240,.35);
      background: linear-gradient(145deg, #141030, #0a1025);
    }
    .res-card.hq-card::after {
      background: radial-gradient(circle, rgba(123,92,240,.08), transparent 70%);
    }
    .res-label {
      font-size: 10px;
      color: var(--text-lo);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── 底部说明 ── */
    footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #141e30;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--text-mid);
    }
    .legend-line {
      width: 28px; height: 2px;
      border-radius: 1px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="title-main">独联体数据全貌 · 销售端</div>
    <div class="title-sub">CIS Region Data Overview — Sales</div>
  </div>
  <button class="btn-feedback">我要提需求 / 建议</button>
</header>

<main>
  <div class="region-frame">
    <div class="region-label">独联体区域 (CIS Region)</div>

    <div class="row">

      <!-- 源节点 -->
      <div class="source-card" id="source">
        <div class="globe-icon">🌐</div>
        <div class="source-title">独联体区域</div>
        <div class="source-sub">CIS Region</div>
        <div class="source-dot"></div>
      </div>

      <!-- SVG 连线 -->
      <svg class="connector-svg" id="connSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 主连线渐变 -->
          <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.15"/>
          </linearGradient>
          <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.15"/>
          </linearGradient>
          <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.15"/>
          </linearGradient>
          <!-- 流光滤镜 -->
          <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 路径在 JS 中动态生成 -->
      </svg>

      <!-- 目标节点列 -->
      <div class="targets-col" id="targets">
        <div class="target-card" id="t1">
          <div class="country-icon">🇷🇺</div>
          <div class="code">RU</div>
          <div class="name-zh">俄罗斯</div>
          <div class="name-en">Russia</div>
        </div>
        <div class="target-card" id="t2">
          <div class="country-icon">🇰🇿</div>
          <div class="code">KZ</div>
          <div class="name-zh">哈萨克斯坦</div>
          <div class="name-en">Kazakhstan</div>
        </div>
        <div class="target-card" id="t3">
          <div class="country-icon">🌏</div>
          <div class="code" style="color: var(--accent3);">CA</div>
          <div class="name-zh">中亚 / 白高</div>
          <div class="name-en">Central Asia</div>
        </div>
      </div>

      <!-- 右侧资源 -->
      <div class="resources-col">
        <div class="res-card ai-card">
          <div class="res-icon">🤖</div>
          <div>AI 赋能</div>
          <div class="res-label">AI Empowerment</div>
        </div>
        <div class="res-card hq-card">
          <div class="res-icon">🏢</div>
          <div>总部资源</div>
          <div class="res-label">HQ Resources</div>
        </div>
      </div>

    </div><!-- .row -->

    <!-- 图例 -->
    <footer>
      <div class="legend-item">
        <div class="legend-line" style="background: linear-gradient(90deg,#00c8ff,rgba(0,200,255,.2))"></div>
        数据流向
      </div>
      <div class="legend-item">
        <div style="width:10px;height:10px;border-radius:50%;background:#00e5a0;box-shadow:0 0 6px rgba(0,229,160,.6)"></div>
        节点在线
      </div>
      <div class="legend-item">
        <div style="width:10px;height:10px;border-radius:50%;background:#00c8ff;box-shadow:0 0 6px rgba(0,200,255,.6)"></div>
        主要节点
      </div>
    </footer>
  </div>
</main>

<script>
  // 动态计算贝塞尔曲线路径，连接 source 右侧中点 → 每个 target 左侧中点
  function buildPaths() {
    const svg    = document.getElementById('connSvg');
    const source = document.getElementById('source');
    const svgRect = svg.getBoundingClientRect();
    const srcRect = source.getBoundingClientRect();

    // source 右中心（相对于 SVG 坐标系）
    const sx = srcRect.right  - svgRect.left;
    const sy = srcRect.top + srcRect.height / 2 - svgRect.top;

    const targetIds = ['t1','t2','t3'];
    const colors    = ['#00c8ff','#00c8ff','#00e5a0'];
    const opacities = [0.55, 0.45, 0.45];

    svg.innerHTML = `<defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;

    targetIds.forEach((id, i) => {
      const t = document.getElementById(id);
      if (!t) return;
      const tr = t.getBoundingClientRect();
      const tx = tr.left  - svgRect.left;
      const ty = tr.top + tr.height / 2 - svgRect.top;

      // 三次贝塞尔：控制点让曲线自然弯曲
      const cp1x = sx + (tx - sx) * 0.45;
      const cp2x = sx + (tx - sx) * 0.55;
      const d = `M ${sx} ${sy} C ${cp1x} ${sy}, ${cp2x} ${ty}, ${tx} ${ty}`;

      // 发光描边（底层）
      const glow = document.createElementNS('http://www.w3.org/2000/svg','path');
      glow.setAttribute('d', d);
      glow.setAttribute('stroke', colors[i]);
      glow.setAttribute('stroke-width', '3.5');
      glow.setAttribute('stroke-opacity', '0.18');
      glow.setAttribute('fill', 'none');
      glow.setAttribute('filter', 'url(#glow)');
      svg.appendChild(glow);

      // 主描边
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('stroke', colors[i]);
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('stroke-opacity', String(opacities[i]));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke-dasharray', '6 3');

      // 动态虚线流动动画
      const len = 500;
      const animDur = 2.5 + i * 0.6;
      path.innerHTML = `<animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="${animDur}s" repeatCount="indefinite"/>`;
      svg.appendChild(path);

      // 终点小圆
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx', String(tx));
      dot.setAttribute('cy', String(ty));
      dot.setAttribute('r', '4');
      dot.setAttribute('fill', colors[i]);
      dot.setAttribute('opacity', '0.7');
      dot.setAttribute('filter', 'url(#glow)');
      svg.appendChild(dot);

      // 起点小圆（只画一次）
      if (i === 0) {
        const sdot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        sdot.setAttribute('cx', String(sx));
        sdot.setAttribute('cy', String(sy));
        sdot.setAttribute('r', '4');
        sdot.setAttribute('fill', '#00c8ff');
        sdot.setAttribute('opacity', '0.8');
        sdot.setAttribute('filter', 'url(#glow)');
        svg.appendChild(sdot);
      }
    });
  }

  window.addEventListener('load', buildPaths);
  window.addEventListener('resize', buildPaths);
</script>
</body>
</html>
