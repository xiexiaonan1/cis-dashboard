<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>需求 / 建议收集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px 64px;
    }
    .form-card {
      width: 100%;
      max-width: 560px;
      background: #161b27;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 36px 36px 40px;
      box-shadow: 0 8px 48px rgba(0,0,0,.5);
    }
    .form-header {
      margin-bottom: 32px;
    }
    .form-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .form-header p {
      font-size: 12px;
      color: #475569;
      line-height: 1.6;
    }
    .q-block {
      margin-bottom: 24px;
    }
    .q-label {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .q-label .q-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #7c3aed33;
      color: #a78bfa;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    input[type=text], textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: inherit;
      padding: 11px 14px;
      line-height: 1.65;
      transition: border-color .15s;
      outline: none;
    }
    input[type=text]:focus, textarea:focus { border-color: #7c3aed; }
    input[type=text]::placeholder, textarea::placeholder { color: #334155; }
    textarea {
      resize: vertical;
      min-height: 110px;
    }
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #7c3aed;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background .2s, transform .1s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: #6d28d9; }
    .submit-btn:active { transform: scale(.98); }
    #success-msg {
      display: none;
      text-align: center;
      padding: 48px 0 16px;
    }
    #success-msg .success-icon { font-size: 48px; margin-bottom: 16px; }
    #success-msg h2 { font-size: 18px; font-weight: 700; color: #a78bfa; margin-bottom: 8px; }
    #success-msg p { font-size: 13px; color: #475569; line-height: 1.7; }
    #success-msg .back-btn {
      display: inline-block;
      margin-top: 28px;
      padding: 9px 24px;
      border: 1px solid #7c3aed;
      border-radius: 8px;
      color: #a78bfa;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    #success-msg .back-btn:hover { background: #7c3aed22; }
    .err-tip {
      display: none;
      font-size: 11px;
      color: #f87171;
      margin-top: 5px;
    }
    .err-tip.show { display: block; }
  </style>
</head>
<body>
<div class="form-card">

  <div id="success-msg">
    <div class="success-icon">✅</div>
    <h2>已收到，感谢反馈！</h2>
    <p>你的需求将被整理并优先跟进。<br/>如有紧急需求可直接联系数据团队。</p>
    <a class="back-btn" onclick="window.close()">关闭窗口</a>
  </div>

  <div id="form-wrap">
    <div class="form-header">
      <h1>我要提需求 / 建议</h1>
      <p>填写完成后点击提交，数据团队将尽快跟进处理。</p>
    </div>

    <!-- Q1 -->
    <div class="q-block">
      <div class="q-label"><span class="q-num">1</span>你是哪个团队 / 角色？</div>
      <input type="text" id="q1" placeholder="例：区国总、销售、GTM、零售等"/>
      <div class="err-tip" id="err-q1">请填写你的团队或角色</div>
    </div>

    <!-- Q2 -->
    <div class="q-block">
      <div class="q-label"><span class="q-num">2</span>需求属于哪类？</div>
      <input type="text" id="q2" placeholder="例：新增报表、现有报表修改、数据权限、体验优化…"/>
      <div class="err-tip" id="err-q2">请填写需求类型</div>
    </div>

    <!-- Q3 -->
    <div class="q-block">
      <div class="q-label"><span class="q-num">3</span>具体描述你的需求或建议</div>
      <textarea id="q3" placeholder="请描述你希望实现什么目标、当前遇到的问题，或对现有功能的改进建议…"></textarea>
      <div class="err-tip" id="err-q3">请填写具体描述（至少10个字）</div>
    </div>

    <!-- Q4 -->
    <div class="q-block">
      <div class="q-label"><span class="q-num">4</span>紧迫程度</div>
      <input type="text" id="q4" placeholder="例：本周需要 / 两周内 / 不急…"/>
      <div class="err-tip" id="err-q4">请填写紧迫程度</div>
    </div>

    <button class="submit-btn" onclick="submitForm()">提交需求</button>
  </div>

</div>
<script>
  // 输入时清除错误提示
  ['q1','q2','q3','q4'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById('err-' + id).classList.remove('show');
    });
  });

  function submitForm() {
    let valid = true;

    ['q1','q2','q4'].forEach(id => {
      const val = document.getElementById(id).value.trim();
      const err = document.getElementById('err-' + id);
      if (!val) { err.classList.add('show'); valid = false; }
      else       { err.classList.remove('show'); }
    });

    const desc = document.getElementById('q3').value.trim();
    const errQ3 = document.getElementById('err-q3');
    if (desc.length < 10) { errQ3.classList.add('show'); valid = false; }
    else                   { errQ3.classList.remove('show'); }

    if (!valid) return;

    const result = {
      角色:     document.getElementById('q1').value.trim(),
      需求类型: document.getElementById('q2').value.trim(),
      描述:     desc,
      紧迫程度: document.getElementById('q4').value.trim(),
      提交时间: new Date().toLocaleString('zh-CN')
    };
    console.log('需求提交：', result);

    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }
</script>
</body>
</html>
